[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "useeg"
version = "1.0.0"
description = "Reproduction pipeline for universal task-independent semantic EEG feature extraction"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = {file = "LICENSE"}
authors = [
  {name = "Hossein Ahmadi"}
]
keywords = [
  "EEG",
  "BCI",
  "semantic feature extraction",
  "task-independent representation learning",
  "autoencoder",
  "Transformer"
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = [
  "matplotlib==3.10.3",
  "mne==1.10.1",
  "moabb==1.4.3",
  "numpy==2.2.6",
  "pandas==2.2.3",
  "PyYAML==6.0.2",
  "scikit-learn==1.6.1",
  "scipy==1.15.3",
  "seaborn==0.13.2",
  "statsmodels==0.14.4",
  "torch==2.7.1",
  "tqdm==4.67.1"
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-cov==6.1.1",
  "ruff==0.11.13"
]

[project.urls]
Article = "https://doi.org/10.1088/1741-2552/add08f"
Repository = "https://github.com/HosseinAhmadi63/Universal-Semantic-EEG-Feature-Extraction"

[project.scripts]
useeg = "useeg.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
useeg = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"scripts/*.py" = ["E402"]
